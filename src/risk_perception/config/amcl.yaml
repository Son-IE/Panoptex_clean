# amcl.yaml
#
# Localization against a SAVED map (nav2_map_server + nav2_amcl), used by
# robot_base.launch.py when `map_yaml` is set -- the saved-map alternative to
# slam_toolbox mapping mode. Only one of the two may run: whichever owns
# `map -> odom` must be stable session to session, because the overhead-camera
# calibration (README §6, global_cam_map_align) is solved once against a
# fixed map origin and is invalid if that origin moves.
#
# Tuning copied from yahboomcar_ws's single-robot X3 nav stack
# (yahboomcar_nav/params/dwa_nav_params.yaml's `amcl:` block, the config
# already used with dwa_nav_params.yaml's nav2_risk_layer wiring per
# CLAUDE.md) rather than the multi-robot yahboomcar_multi params, which are
# namespaced and use the omnidirectional motion model -- the X3 here is
# differential drive.

amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
